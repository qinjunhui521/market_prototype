<title>CoinW 行情页原型</title>
<style>
  /* 字体栈按 DESIGN.md §3：Satoshi(英文/数字) + PingFang SC(中文) + 系统兜底。
     Satoshi 非 Google Fonts 字体，本环境无法从允许的 CDN 拉取，故仅声明字体栈，
     由设备已安装的 PingFang SC / 系统无衬线字体兜底渲染。 */
  :root{
    --chrome-bg:#f4f5f7; --chrome-panel:#ffffff; --chrome-border:#e5e7eb;
    --chrome-text:#1A1A1A; --chrome-text-dim:#8C8C8C; --chrome-accent:#5227FF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --chrome-bg:#0f1115; --chrome-panel:#181b21; --chrome-border:#2a2e37;
      --chrome-text:#e5e7eb; --chrome-text-dim:#9aa1ac; --chrome-accent:#6C4FFF;
    }
  }
  :root[data-theme="dark"]{
    --chrome-bg:#0f1115; --chrome-panel:#181b21; --chrome-border:#2a2e37;
    --chrome-text:#e5e7eb; --chrome-text-dim:#9aa1ac; --chrome-accent:#6C4FFF;
  }
  body{ background:var(--chrome-bg); font-family:"Satoshi","PingFang SC","HarmonyOS Sans","Noto Sans SC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:#c7cad1; border-radius:3px; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ============ 0. 设计 token（来自 PM 补充的 CoinW DESIGN.md v1，§2 色彩体系） ============ */
const UP = "#14A739";        // Success / Up（上涨、成功）
const UP_LIGHT = "#D0EDD7";  // Success / Up 浅底
const DOWN = "#E95032";      // Negative / Down（下跌、错误）
const DOWN_LIGHT = "#FFF5F0"; // Negative / Down 浅底
const BRAND = "#5227FF";     // CoinW Purple / Brand（主 CTA、选中态、激活图标）
const BRAND_HOVER = "#6C4FFF"; // Purple Medium（hover/次级紫）
const BRAND_LIGHT = "#ECE8FF"; // Brand Light（浅底）
const WARNING = "#FE6F00";     // Warning（风险/注意）
const WARNING_LIGHT = "#FEEFE5"; // Warning 浅底
const TEXT_1 = "#1A1A1A";   // Midnight/Ink 主文本
const TEXT_2 = "#404040";   // 次级正文
const TEXT_3 = "#8C8C8C";   // 辅助/说明文字
const SURFACE_2 = "#F2F2F2"; // 次级表面
const BORDER = "#D9D9D9";    // 分割线/边框
const NAV_TABS = ["自选", "加密货币", "TradFi", "社区"];
const NAV_TARGET = { "自选": "p0", "加密货币": "p1", "TradFi": "p2", "社区": "p8" };

/* ============ 1. 通用小组件 ============ */
function Icon({ name, size = 18, className = "" }) {
  const P = {
    search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-5.6-5.6",
    chev: "M9 6l6 6-6 6",
    more: "M12 5v.01M12 12v.01M12 19v.01",
    bell: "M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0",
    star: "M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21l1.2-6.9-5-4.9 6.9-1L12 2Z",
    home: "M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8Z",
    chart: "M4 20V10M10 20V4M16 20v-7M22 20H2",
    swap: "M7 4v13M7 17 3 13M17 20V7m0 0 4 4",
    layers: "M12 3 3 8l9 5 9-5-9-5ZM3 13l9 5 9-5",
    wallet: "M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3H3V7Zm0 3h17v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7Zm12 3.5h3",
    users: "M17 20a4 4 0 0 0-10 0M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 1a3 3 0 0 1 3 3M2 16a3 3 0 0 1 3-3",
    grid: "M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z",
    whale: "M3 14c3-6 9-9 15-6 2 1 3 3 3 5-2 0-3 1-3 2 2 1 3 0 3 2-2 2-6 2-9 1-4 3-9 2-9-1 1-1 2-2 1-3-2 0-2-1 0 0Z",
    lock: "M6 11V8a6 6 0 1 1 12 0v3M5 11h14v9H5v-9Z",
    play: "M8 5v14l11-7-11-7Z",
    check: "M5 13l4 4L19 7",
  }[name] || "M12 12h.01";
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      <path d={P} />
    </svg>
  );
}

const pct = (v) => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
function PctTag({ v, size = "text-xs" }) {
  return <span className={`${size} font-medium`} style={{ color: v >= 0 ? UP : DOWN }}>{pct(v)}</span>;
}
function FollowBtn({ following, onClick, small }) {
  return (
    <button onClick={onClick}
      className={`shrink-0 rounded-full border font-medium ${small ? "px-2.5 py-1 text-[11px]" : "px-3.5 py-1.5 text-xs"} ${
        following ? "bg-[#F2F2F2] text-[#8C8C8C] border-[#D9D9D9]" : "text-white border-transparent"
      }`}
      style={!following ? { background: BRAND } : {}}>
      {following ? "已关注" : "+ 关注"}
    </button>
  );
}
function SectionHead({ title, onMore }) {
  return (
    <div className="flex items-center justify-between px-4 pt-4 pb-2">
      <span className="text-[15px] font-bold text-[#1A1A1A]">{title}</span>
      {onMore && (
        <button onClick={onMore} className="flex items-center text-xs text-[#8C8C8C]">
          查看全部<Icon name="chev" size={14} />
        </button>
      )}
    </div>
  );
}
function Chip({ label, active, onClick }) {
  return (
    <button onClick={onClick}
      className={`shrink-0 px-3 py-1.5 rounded-full text-[12px] font-medium border ${
        active ? "border-[#1A1A1A] text-[#1A1A1A] bg-white" : "border-transparent bg-[#F2F2F2] text-[#404040]"
      }`}>{label}</button>
  );
}
function ChipRow({ items, active, onChange }) {
  return (
    <div className="flex gap-2 px-4 py-2 overflow-x-auto no-scrollbar">
      {items.map((c) => <Chip key={c} label={c} active={active === c} onClick={() => onChange(c)} />)}
    </div>
  );
}
function MarketRow({ item, onClick }) {
  return (
    <div onClick={onClick}
      className={`flex items-center justify-between px-4 py-3 border-b border-[#D9D9D9] ${onClick ? "cursor-pointer active:bg-[#F2F2F2]" : ""}`}>
      <div className="flex items-center gap-3">
        <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-[11px] font-bold shrink-0"
          style={{ background: item.color || BRAND }}>{item.icon}</div>
        <div>
          <div className="flex items-center gap-1.5">
            <span className="font-semibold text-[14px] text-[#1A1A1A]">{item.code}</span>
            {item.tag && <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-[#F2F2F2] text-[#404040]">{item.tag}</span>}
          </div>
          <div className="text-[12px] text-[#8C8C8C] mt-0.5">{item.sub}</div>
        </div>
      </div>
      <div className="text-right">
        <div className="font-semibold text-[14px] text-[#1A1A1A]">{item.price}</div>
        <PctTag v={item.chg} />
      </div>
    </div>
  );
}

/* ============ 2. 状态占位（空 / 加载 / 错误） ============ */
function LoadingState() {
  return (
    <div className="p-4 space-y-3 animate-pulse">
      {[1, 2, 3, 4, 5].map(i => (
        <div key={i} className="flex items-center gap-3">
          <div className="w-8 h-8 rounded-full bg-[#F2F2F2]" />
          <div className="flex-1 space-y-2">
            <div className="h-3 bg-[#F2F2F2] rounded w-1/3" />
            <div className="h-2.5 bg-[#F2F2F2] rounded w-1/4" />
          </div>
          <div className="w-14 h-3 bg-[#F2F2F2] rounded" />
        </div>
      ))}
    </div>
  );
}
function EmptyState({ text = "暂无数据" }) {
  return (
    <div className="flex flex-col items-center justify-center py-20 text-[#A6A6A6]">
      <Icon name="grid" size={40} />
      <div className="text-[13px] mt-3 text-[#8C8C8C]">{text}</div>
    </div>
  );
}
function ErrorState() {
  return (
    <div className="flex flex-col items-center justify-center py-20">
      <div className="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold"
        style={{ background: DOWN_LIGHT, color: DOWN }}>!</div>
      <div className="text-[13px] mt-3 text-[#404040]">网络异常，数据加载失败</div>
      <button className="mt-3 text-[12px] px-4 py-1.5 rounded-[16px] text-white font-medium" style={{ background: BRAND }}>重试</button>
    </div>
  );
}
/* 页面内容外壳：根据全局 demoState + 当前区域是否支持该状态（allowEmpty）决定渲染
   真实内容 / 占位态。loading、error 对所有区域都成立；empty 仅对声明支持的区域
   生效，其余区域即使全局 demoState 已切换，也照常渲染默认内容。 */
function Frame({ demoState, allowEmpty, children }) {
  if (demoState === "loading") return <LoadingState />;
  if (demoState === "error") return <ErrorState />;
  if (demoState === "empty") return allowEmpty ? <EmptyState /> : children;
  return children;
}

/* ============ 3. App 壳：状态栏 + 顶部一二级 tab + 底部 tab bar / 自定义 footer ============ */
/* 一期：「可交易」= 已关联 CoinW TradFi 合约，点击直接跳合约页（美股直连二期再接入） */
function tradeInfo(code) { return autoMatch({ code }, "contract"); }
function TradeTag({ code }) {
  if (!tradeInfo(code)) return null;
  return <span className="text-[10px] px-1.5 py-0.5 rounded-full shrink-0 font-medium" style={{ background: BRAND_LIGHT, color: BRAND }}>可交易</span>;
}
/* 可交易的整行点击直接跳 TradFi 合约页，否则走原有标的详情 */
const tradeGo = (code) => (e) => { const c = tradeInfo(code); if (c) window.open(secUrl("contract", c.code), "_blank", "noopener"); else e.currentTarget.dispatchEvent(new CustomEvent("phone-toast", { bubbles: true, detail: "该股票暂不支持交易" })); };
function PhoneChrome({ children, navTabs, navActive, sub, subActive, onSub, showSearch = true, bottomActive = "行情", footer }) {
  const [toast, setToast] = React.useState("");
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current; let t;
    const h = (e) => { setToast(e.detail); clearTimeout(t); t = setTimeout(() => setToast(""), 2000); };
    el.addEventListener("phone-toast", h);
    return () => { el.removeEventListener("phone-toast", h); clearTimeout(t); };
  }, []);
  return (
    <div ref={ref} className="bg-white text-[#1A1A1A] relative">
      {toast && <div className="absolute left-1/2 z-50 -translate-x-1/2 bg-[rgba(26,26,26,.88)] text-white text-[12px] px-3.5 py-2 rounded-[8px] whitespace-nowrap" style={{ bottom: 80 }}>{toast}</div>}
      <div className="flex items-center justify-between px-4 pt-2 pb-1 text-[11px] font-semibold text-[#1A1A1A]">
        <span>17:03</span>
        <div className="flex items-center gap-1 text-[#1A1A1A]">
          <span>••••</span><span>📶</span><span>🔋</span>
        </div>
      </div>
      {showSearch && (
        <div className="flex items-center gap-3 px-4 pb-2">
          <div className="flex-1 flex items-center gap-2 bg-[#F2F2F2] rounded-full px-3 py-2 text-[#8C8C8C]">
            <Icon name="search" size={15} /><span className="text-[13px]">搜索币种/股票/合约</span>
          </div>
          <Icon name="more" size={18} className="text-[#1A1A1A]" />
        </div>
      )}
      {navTabs && (
        <div className="flex gap-4 px-4 text-[14px] overflow-x-auto no-scrollbar border-b border-[#D9D9D9]">
          {navTabs.map((t) => (
            <button key={t} onClick={() => { const id = NAV_TARGET[t]; if (id && t !== navActive && window.__goTo) window.__goTo(id); }} className={`pb-2 shrink-0 relative ${t === navActive ? "text-[#1A1A1A] font-bold border-b-2 border-[#1A1A1A]" : "text-[#8C8C8C] font-medium"}`}>{t}{t === "TradFi" && <span data-testid="new-badge" className="inline-block align-top ml-0.5 -mt-0.5 text-[9px] font-bold leading-none text-white rounded-full px-1 py-[2px]" style={{ background: "#F5222D" }}>NEW</span>}</button>
          ))}
        </div>
      )}
      {sub && (
        <div className="flex gap-4 px-4 pt-2 text-[13px] border-b border-[#D9D9D9] overflow-x-auto no-scrollbar">
          {sub.map((t) => (
            <button key={t} onClick={() => onSub && onSub(t)}
              className={`pb-2 shrink-0 ${t === subActive ? "text-[#1A1A1A] font-bold border-b-2 border-[#1A1A1A]" : "text-[#8C8C8C] font-medium"}`}>{t}</button>
          ))}
        </div>
      )}
      <div style={{ minHeight: 420, maxHeight: 780, overflowY: "auto" }}>{children}</div>
      {footer ? footer : (
        <div className="flex items-center justify-around border-t border-[#D9D9D9] py-2 bg-white">
          {[["home", "首页"], ["chart", "行情"], ["swap", "交易"], ["layers", "合约"], ["wallet", "资产"]].map(([ic, label]) => (
            <div key={label} className={`flex flex-col items-center gap-0.5 ${label === bottomActive ? "text-[#1A1A1A]" : "text-[#A6A6A6]"}`}>
              <Icon name={ic} size={18} /><span className="text-[10px]">{label}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============ 4. 高级感组件：情绪仪表盘 / 板块与概念大卡片 ============ */
function polarToCartesian(cx, cy, r, angleDeg) {
  const a = (angleDeg * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy - r * Math.sin(a) };
}
function SentimentGauge({ value, label, stats = [] }) {
  const cx = 66, cy = 66, r = 54;
  const angle = 180 - (value / 100) * 180;
  const marker = polarToCartesian(cx, cy, r, angle);
  const gid = "gaugeGrad_" + label.length + value;
  return (
    <div className="flex items-center gap-4 px-4 py-3.5 rounded-[16px]"
      style={{ background: `linear-gradient(135deg, ${BRAND_LIGHT} 0%, #F2F2F2 100%)` }}>
      <svg width="132" height="76" viewBox="0 0 132 76" className="shrink-0">
        <defs>
          <linearGradient id={gid} x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor={DOWN} />
            <stop offset="40%" stopColor={WARNING} />
            <stop offset="72%" stopColor="#89D39C" />
            <stop offset="100%" stopColor={UP} />
          </linearGradient>
        </defs>
        <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} fill="none" stroke={`url(#${gid})`} strokeWidth="9" strokeLinecap="round" />
        <circle cx={marker.x} cy={marker.y} r="6.5" fill="#fff" stroke={TEXT_1} strokeWidth="2.5" />
      </svg>
      <div className="flex-1 min-w-0">
        <div className="text-[30px] leading-none font-extrabold" style={{ color: TEXT_1 }}>{value}</div>
        <div className="text-[11px] text-[#8C8C8C] mt-1 truncate">{label}</div>
        <div className="mt-1.5 space-y-1">
          {stats.map((s) => (
            <div key={s.label} className="text-[11px] flex items-center gap-1 truncate">
              <span className="text-[#8C8C8C] shrink-0">{s.label}</span>
              <span className="font-semibold truncate" style={{ color: s.color || TEXT_1 }}>{s.value}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
function Sparkline({ up }) {
  const bars = up ? [4, 6, 5, 8, 7, 10, 9] : [10, 8, 9, 6, 7, 4, 3];
  return (
    <div className="flex items-end gap-[2px] h-4 mt-1.5 opacity-80">
      {bars.map((h, i) => <div key={i} className="w-[3px] rounded-sm bg-white" style={{ height: h * 1.1 }} />)}
    </div>
  );
}
function ConceptTile({ name, chg }) {
  const up = chg >= 0;
  return (
    <div className="rounded-[16px] px-3 py-3 relative overflow-hidden text-white"
      style={{ background: up ? `linear-gradient(135deg, ${UP} 0%, #0c6e28 100%)` : `linear-gradient(135deg, ${DOWN} 0%, #a83321 100%)` }}>
      <div className="text-[12px] font-bold relative z-10">{name}</div>
      <div className="text-[16px] font-extrabold mt-2 relative z-10">{pct(chg)}</div>
      <Sparkline up={up} />
      <div className="absolute -right-3 -bottom-3 w-14 h-14 rounded-full bg-white/10" />
    </div>
  );
}
function SectorTile({ s, big, onClick }) {
  const up = s.chg >= 0;
  return (
    <div onClick={onClick}
      className={`rounded-[16px] text-white relative overflow-hidden ${big ? "px-4 py-5 col-span-2" : "px-3 py-3"} ${onClick ? "cursor-pointer" : ""}`}
      style={{ background: up ? `linear-gradient(135deg, ${UP} 0%, #0c6e28 100%)` : `linear-gradient(135deg, ${DOWN} 0%, #a83321 100%)` }}>
      <div className={`font-semibold relative z-10 ${big ? "text-[16px]" : "text-[13px]"}`}>{s.name}</div>
      <div className={`opacity-90 mt-1 relative z-10 ${big ? "text-[12px]" : "text-[11px]"}`}>{s.n} 只成分股</div>
      <div className={`font-extrabold mt-2 relative z-10 ${big ? "text-[24px]" : "text-[14px]"}`}>{pct(s.chg)}</div>
      <div className={`absolute rounded-full bg-white/10 ${big ? "-right-6 -bottom-6 w-28 h-28" : "-right-3 -bottom-3 w-14 h-14"}`} />
    </div>
  );
}
function SectorGrid({ sectors }) {
  const sorted = [...sectors].sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg));
  const [hero, ...rest] = sorted;
  return (
    <div className="grid grid-cols-2 gap-2 px-4">
      <SectorTile s={hero} big />
      {rest.slice(0, 3).map(s => <SectorTile key={s.name} s={s} />)}
    </div>
  );
}

/* ---- 热力图（涨跌幅决定色深）：用于板块 / 概念板块 ---- */
function heatColor(chg) {
  const up = chg >= 0;
  const v = Math.min(Math.abs(chg) / 7, 1);
  const base = up ? [20, 167, 57] : [233, 80, 50];
  const mixed = base.map((c) => Math.round(255 + (c - 255) * (0.25 + 0.75 * v)));
  return { bg: `rgb(${mixed.join(",")})`, dark: v < 0.45 };
}
function HeatmapTile({ s, big, onClick }) {
  const { bg, dark } = heatColor(s.chg);
  return (
    <div onClick={onClick}
      className={`rounded-[10px] flex flex-col justify-between ${big ? "col-span-2 row-span-2 px-3 py-3 min-h-[104px]" : "px-2.5 py-2 min-h-[72px]"} ${onClick ? "cursor-pointer" : ""}`}
      style={{ background: bg, color: dark ? TEXT_1 : "#fff" }}>
      <div className={`font-semibold leading-tight truncate ${big ? "text-[14px]" : "text-[11px]"}`}>{s.name}</div>
      <div className={`font-extrabold ${big ? "text-[20px]" : "text-[12px]"}`}>{pct(s.chg)}</div>
    </div>
  );
}
function HeatmapGrid({ items, onClick }) {
  const sorted = [...items].sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg));
  const [hero, ...rest] = sorted;
  return (
    <div className="grid grid-cols-4 auto-rows-[52px] gap-1.5 px-4">
      <HeatmapTile s={hero} big onClick={onClick ? () => onClick(hero) : undefined} />
      {rest.map((s) => <HeatmapTile key={s.name} s={s} onClick={onClick ? () => onClick(s) : undefined} />)}
    </div>
  );
}

/* ---- 涨跌分布 ---- */
const DIST_BUCKETS = [
  { label: "≤-7%", n: 390, kind: "down" },
  { label: "-7~-5%", n: 197, kind: "down" },
  { label: "-5~-3%", n: 467, kind: "down" },
  { label: "-3~0%", n: 5833, kind: "down" },
  { label: "0", n: 4631, kind: "flat" },
  { label: "0~3%", n: 5297, kind: "up" },
  { label: "3~5%", n: 497, kind: "up" },
  { label: "5~7%", n: 223, kind: "up" },
  { label: "≥7%", n: 517, kind: "up" },
];
/* ---- 涨跌分布：按市场区分（美股/港股/A股 覆盖规模差异很大，用不同 bucket 体现） ---- */
const DIST_US_BUCKETS = [
  { label: "≤-7%", n: 210, kind: "down" }, { label: "-7~-5%", n: 98, kind: "down" },

/* ---- 交易数据：资金流向环形图 ---- */
function arcPath(cx, cy, r, startAngle, sweep) {
  const a1 = (startAngle * Math.PI) / 180, a2 = ((startAngle + sweep) * Math.PI) / 180;
  const p1 = { x: cx + r * Math.cos(a1), y: cy + r * Math.sin(a1) };
  const p2 = { x: cx + r * Math.cos(a2), y: cy + r * Math.sin(a2) };
  const large = sweep > 180 ? 1 : 0;
  return `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y}`;
}
function FlowDonut({ segments }) {
  const cx = 74, cy = 74, r = 58, sw = 20;
  let angle = -90;
  const arcs = segments.map((s) => {
    const sweep = Math.max((s.v / 100) * 360, 2);
    const path = arcPath(cx, cy, r, angle, sweep);
    angle += sweep;
    return { ...s, path };
  });
  return (
    <div className="relative shrink-0" style={{ width: 148, height: 148 }}>
      <svg width="148" height="148" viewBox="0 0 148 148">
        {arcs.map((a, i) => <path key={i} d={a.path} fill="none" stroke={a.color} strokeWidth={sw} strokeLinecap="butt" />)}
      </svg>
      <div className="absolute inset-0 flex items-center justify-center text-center px-6">
        <div className="text-[11px] text-[#8C8C8C] leading-tight" style={{ whiteSpace: "pre-line" }}>过去15分钟{"\n"}资金流向</div>
      </div>
    </div>
  );
}

/* ---- 宏观数据：chip 切换 + 实际/预测双线图 ---- */
function MacroChart({ series, width = 311, height = 110 }) {
  const all = series.actual.concat(series.pred);
  const max = Math.max(...all), min = Math.min(...all);
  const pad = (max - min) * 0.15 || 1;
  const yMax = max + pad, yMin = min - pad;
  const y = (v) => height - ((v - yMin) / (yMax - yMin)) * height;
  const x = (i, n) => (i / (n - 1)) * width;
  const toPath = (arr) => arr.map((v, i) => `${i === 0 ? "M" : "L"} ${x(i, arr.length)} ${y(v)}`).join(" ");
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <path d={toPath(series.actual)} fill="none" stroke={BRAND} strokeWidth="2" />
      <path d={toPath(series.pred)} fill="none" stroke="#8C8C8C" strokeWidth="1.5" strokeDasharray="4,3" />
    </svg>
  );
}

function DiagnosisGauge({ score }) {
  const cx = 66, cy = 66, r = 54;
  const angle = 180 - (score / 100) * 180;
  const marker = polarToCartesian(cx, cy, r, angle);
  const desc = score >= 75 ? "信心强" : score >= 50 ? "中性偏强" : score >= 30 ? "谨慎" : "风险高";
  return (

        <defs>
          <linearGradient id="diagGaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor={DOWN} /><stop offset="50%" stopColor={WARNING} /><stop offset="100%" stopColor={UP} />
          </linearGradient>
        </defs>
        <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} fill="none" stroke="url(#diagGaugeGrad)" strokeWidth="9" strokeLinecap="round" />
        <circle cx={marker.x} cy={marker.y} r="6.5" fill="#fff" stroke={TEXT_1} strokeWidth="2.5" />

      <div>

      </div>
    </div>
  );
}

function CandleChart({ width = 343, height = 168, data = CANDLES }) {
  const all = data.flatMap(d => [d.h, d.l]);
  const max = Math.max(...all), min = Math.min(...all);
  const pad = (max - min) * 0.1 || 1;
  const yMax = max + pad, yMin = min - pad;
  const y = (v) => height - ((v - yMin) / (yMax - yMin)) * height;
  const bw = width / data.length;
  const last = data[data.length - 1].c;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <line x1="0" y1={y(last)} x2={width} y2={y(last)} stroke={BORDER} strokeDasharray="3,3" />
      {data.map((d, i) => {
        const cx = i * bw + bw / 2;
        const up = d.c >= d.o;
        const color = up ? UP : DOWN;
        const top = y(Math.max(d.o, d.c)), bot = y(Math.min(d.o, d.c));
        return (
          <g key={i}>
            <line x1={cx} y1={y(d.h)} x2={cx} y2={y(d.l)} stroke={color} strokeWidth="1" />
            <rect x={cx - bw * 0.28} y={top} width={bw * 0.56} height={Math.max(2, bot - top)} fill={color} />
          </g>
        );
      })}
      <rect x={width - 54} y={Math.max(0, y(last) - 10)} width="54" height="20" rx="4" fill={TEXT_1} />
      <text x={width - 49} y={Math.max(14, y(last) + 4)} fontSize="10" fill="#fff">{last.toFixed(2)}</text>
    </svg>
  );
}

function genCandles(base, n = 20) {
  const arr = [];
  let prev = base * 0.985;
  for (let i = 0; i < n; i++) {
    const wave = Math.sin(i / 2.6) * base * 0.018 + Math.sin(i / 6) * base * 0.01;
    const drift = (i - n / 2) * base * 0.0015;
    const c = +(base + wave + drift).toFixed(2);
    const o = +prev.toFixed(2);
    const h = +(Math.max(o, c) + base * 0.004).toFixed(2);
    const l = +(Math.min(o, c) - base * 0.004).toFixed(2);
    arr.push({ o, c, h, l });
    prev = c;
  }
  return arr;
}

function MiniLine({ up, seed = 1 }) {
  const pts = Array.from({ length: 9 }, (_, i) => 10 + Math.sin(i * 1.3 + seed) * 3 + (up ? i * 0.9 : -i * 0.9) + 8);
  const mn = Math.min(...pts), mx = Math.max(...pts);
  const d = pts.map((y, i) => `${i === 0 ? "M" : "L"}${(i / 8) * 34} ${16 - ((y - mn) / (mx - mn || 1)) * 14}`).join(" ");
  return <svg width="34" height="18" viewBox="0 0 34 18"><path d={d} fill="none" stroke={up ? UP : DOWN} strokeWidth="1.4" strokeLinecap="round" /></svg>;
}
function AreaLine({ up, seed = 1, n = 60, h = 44 }) {
  const r = lcg(seed * 7 + 3);
  let v = 0; const raw = [];
  for (let i = 0; i < n; i++) { v += (r() - 0.5) * 2 + (up ? 0.07 : -0.07); raw.push(v); }
  const mn = Math.min(...raw), mx = Math.max(...raw);
  const pts = raw.map((y, i) => [(i / (n - 1)) * 100, 3 + (1 - (y - mn) / (mx - mn || 1)) * (h - 8)]);
  const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(2)} ${y.toFixed(2)}`).join(" ");
  const c = up ? UP : DOWN, gid = `ag${seed}${up ? "u" : "d"}`;
  return (
    <svg viewBox={`0 0 100 ${h}`} width="100%" height={h} preserveAspectRatio="none" className="block mt-2">
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={c} stopOpacity="0.22" /><stop offset="1" stopColor={c} stopOpacity="0" /></linearGradient></defs>
      <path d={`${line} L100 ${h} L0 ${h} Z`} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={c} strokeWidth="1.3" vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
    </svg>
  );
}

function useInfinite(total, step = 10) {
  const [n, setN] = useState(step);
  const [loading, setLoading] = useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el || n >= total || loading || typeof IntersectionObserver === "undefined") return;
    const io = new IntersectionObserver((es) => {
      if (es.some((e) => e.isIntersecting)) {
        setLoading(true);
        setTimeout(() => { setN((x) => Math.min(total, x + step)); setLoading(false); }, 500);
      }
    }, { threshold: 0.01 });
    io.observe(el);
    return () => io.disconnect();
  }, [n, total, loading]);
  const footer = (
    <div ref={ref} className="py-3 text-center text-[11px] text-[#8C8C8C]">{n >= total ? "已加载全部" : loading ? "加载中…" : "上拉加载更多"}</div>
  );
  return { n, footer };
}

function smoothPath(pts) {
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

function dateAt(i, n) { const d = new Date(Date.UTC(2025, 10, 11) + (i / (n - 1)) * 365 * 864e5); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`; }
function LineChart({ lines, w = 343, h = 190, xl = ["25/11", "26/02", "26/05", "26/08", "26/11"] }) {
  const n = lines[0].data.length;
  const [sel, setSel] = useState(n - 1);
  const all = lines.flatMap((l) => l.data);
  const mn0 = Math.min(...all), mx0 = Math.max(...all), pad = (mx0 - mn0) * 0.06;
  const lo = mn0 - pad, hi = mx0 + pad;
  const ticks = [0, 1, 2, 3, 4].map((k) => hi - ((hi - lo) / 4) * k);
  const L = 50, R = 6, T = 8, B = 22;
  const X = (i) => L + (i / (n - 1)) * (w - L - R);
  const Y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * (h - T - B);
  const pick = (e) => { const r = e.currentTarget.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width) * w; setSel(Math.max(0, Math.min(n - 1, Math.round(((x - L) / (w - L - R)) * (n - 1))))); };
  const leg = [...lines].reverse();
  return (<>
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} style={{ touchAction: "none" }} onPointerDown={pick} onPointerMove={pick}>
      {ticks.map((v) => <g key={v}><line x1={L} x2={w - R} y1={Y(v)} y2={Y(v)} stroke="#F0F0F0" /><text x={L - 8} y={Y(v) + 3.5} textAnchor="end" fontSize="10.5" fill="#A6A6A6">{v.toFixed(2)}%</text></g>)}
      {xl.map((t, i) => <text key={t} x={L + (i / (xl.length - 1)) * (w - L - R)} y={h - 6} textAnchor={i === 0 ? "start" : i === xl.length - 1 ? "end" : "middle"} fontSize="10" fill="#A6A6A6">{t}</text>)}
      <line x1={X(sel)} x2={X(sel)} y1={T} y2={h - B} stroke="#BFBFBF" strokeDasharray="3 3" />
      {lines.map((l) => <path key={l.name} d={smoothPath(l.data.map((y, i) => [X(i), Y(y)]))} fill="none" stroke={l.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />)}
      {lines.map((l) => <circle key={l.name} cx={X(sel)} cy={Y(l.data[sel])} r="4" fill={l.color} stroke="#fff" strokeWidth="1.5" />)}
    </svg>
    <div className="mt-1 mb-1">
      <div className="text-[12px] text-[#8C8C8C] mb-1.5">{dateAt(sel, n)}{sel === n - 1 ? "（最新）" : ""}</div>
      <div className="grid grid-cols-3 gap-2">{leg.map((l) => <div key={l.name}><div className="flex items-center gap-1.5 text-[12px] text-[#404040]"><i className="inline-block w-3.5 h-[3px] rounded" style={{ background: l.color }} />{l.label}</div><div className="text-[15px] font-bold mt-0.5">{l.data[sel] >= 0 ? "+" : ""}{l.data[sel].toFixed(2)}%</div></div>)}</div>
    </div>
  </>);
}

      <rect x={padL} y={padT} width={pw} height={ph} fill="transparent" style={{ cursor: "crosshair" }} onPointerMove={pick} onPointerDown={pick} onClick={pick} />

/* ===== 多语言批量：下载/上传 CSV ===== */
function csvEsc(v) { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function csvParse(text) {
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim() !== ""));
}
function BulkI18n({ filename, getRows, plan, apply, say, noun }) {
  const [pend, setPend] = React.useState(null);
  const ref = React.useRef(null);
  const download = () => {
    const csv = "﻿" + getRows().map((r) => r.map(csvEsc).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    say("已下载 " + filename);
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { setPend({ file: f.name, ...plan(csvParse(String(r.result))) }); } catch (err) { setPend({ file: f.name, error: "文件解析失败" }); } };
    r.readAsText(f, "utf-8");
  };
  const ok = pend && !pend.error && pend.changes.length > 0;
  return (
    <>
      <button onClick={download} className="px-3 py-1.5 rounded-[8px] border border-[#D9D9D9] text-[13px] bg-white whitespace-nowrap">下载{noun}多语言</button>
      <button onClick={() => ref.current && ref.current.click()} className="px-3 py-1.5 rounded-[8px] border text-[13px] bg-white whitespace-nowrap" style={{ borderColor: BRAND, color: BRAND }}>上传{noun}多语言</button>
      <input ref={ref} type="file" accept=".csv,text/csv" className="hidden" onChange={onFile} />
      {pend && (
        <AdminModal wide title={`上传预览 · ${pend.file}`} okText={ok ? `确认导入（${pend.changes.length} 处）` : "确定"} onClose={() => setPend(null)} onOk={() => { if (ok) { apply(pend.changes); say(`已导入 ${pend.changes.length} 处多语言`); } setPend(null); }}>
          {pend.error ? <div className="text-[13px]" style={{ color: DOWN }}>{pend.error}</div> : (
            <div className="text-[13px]">
              <div className="mb-2">将更新 <b>{new Set(pend.changes.map((c) => c.key)).size}</b> 个{noun}、共 <b>{pend.changes.length}</b> 处文案；未匹配 <b style={{ color: pend.unmatched.length ? DOWN : "inherit" }}>{pend.unmatched.length}</b> 行；空单元格不会覆盖已有内容。</div>
              {pend.unmatched.length > 0 && <div className="text-[12px] mb-2" style={{ color: DOWN }}>未匹配（请检查{noun}编号）：{pend.unmatched.slice(0, 8).join("、")}{pend.unmatched.length > 8 ? " …" : ""}</div>}
              {pend.changes.length === 0 ? <div className="text-[#8C8C8C]">没有检测到需要更新的内容。</div> : (
                <table className="w-full text-[12px]"><thead><tr className="text-left text-[#8C8C8C] bg-[#FAFAFA]">{[noun, "语言/字段", "原内容", "新内容"].map((h) => <th key={h} className="px-2 py-1 font-normal">{h}</th>)}</tr></thead>
                  <tbody>{pend.changes.slice(0, 12).map((c, i) => <tr key={i} className="border-t border-[#F0F0F0]"><td className="px-2 py-1">{c.label}</td><td className="px-2 py-1 whitespace-nowrap">{c.what}</td><td className="px-2 py-1 text-[#8C8C8C] max-w-[140px] truncate">{c.old || "（空）"}</td><td className="px-2 py-1 max-w-[160px] truncate">{c.nv}</td></tr>)}</tbody></table>
              )}
              {pend.changes.length > 12 && <div className="text-[11px] text-[#8C8C8C] mt-1">仅预览前 12 处，其余同样会导入。</div>}
            </div>
          )}
        </AdminModal>
      )}
    </>
  );
}

            {edit ? <>
              <RelBox kind="direct" label="美股直连列表" hint="系统按代码自动匹配 CoinW 已上线美股；匹配不上可手动绑定，已绑定的点击可跳转" />
              <RelBox kind="contract" label="CoinW 合约列表" hint="系统按代码自动匹配 TradFi 合约；合约代码与标的代码不一致时手动绑定" />
            </> : <div className="text-[12px] text-[#8C8C8C] border-t border-[#F0F0F0] pt-3">保存后系统将按代码自动匹配美股直连 / 合约，匹配不上可在编辑中手动绑定。</div>}
          </AdminModal>
        );
      })()}
      {toast && <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[60] bg-[#1A1A1A] text-white text-[13px] px-4 py-2 rounded-[8px]">{toast}</div>}
    </div>
  );
}

function AdminBackend() {
  const [page, setPage] = React.useState("security");
  return (
    <div className="flex" style={{ minHeight: "calc(100vh - 100px)" }}>
      <div className="w-[180px] shrink-0 bg-[#111827] text-white text-[13px] py-4">
        <div className="px-4 mb-3 font-bold">CoinW 运营后台</div>
        <div className="px-4 py-2 text-[#9CA3AF]">TradFi 内容</div>
        {[["security", "标的库管理"], ["master", "大师持仓管理"], ["sector", "板块管理"], ["anomaly", "市场异动管理"], ["macro", "宏观指标管理"]].map(([k, l]) => <button key={k} onClick={() => setPage(k)} className="block w-full text-left px-4 py-2" style={page === k ? { background: BRAND } : { color: "#D1D5DB" }}>{l}</button>)}
      </div>
      {page === "security" ? <AdminSecurityBackend /> : page === "master" ? <AdminMasterBackend /> : page === "sector" ? <AdminSectorBackend /> : page === "anomaly" ? <AdminAnomalyBackend /> : <AdminMacroBackend />}
    </div>
  );
}

/* ============ 10. 左侧栏 / 顶部横幅 / 全景总览 ============ */
function Banner({ mode, setMode }) {
  return (
    <div className="border-b" style={{ background: WARNING_LIGHT, borderColor: "#FDDBAA" }}>
      <div className="px-4 py-2 text-[12px] flex flex-wrap items-center gap-2" style={{ color: "#9A4400" }}>
        <span>⚠️ 草稿原型</span><span>· 需求：TradFi引导用户交易产品方案</span>
        <span>· 无真实后端</span><span>· 不触发真实交易</span>
      </div>
      <div className="px-4 pb-2 flex items-center gap-3">
        <div className="flex rounded-[8px] overflow-hidden border text-[12px]" style={{ borderColor: WARNING }}>
          {[["journey", "用户旅程模式"], ["panorama", "全景总览模式"]].map(([k, l]) => (
            <button key={k} onClick={() => setMode(k)}
              className="px-3 py-1"
              style={mode === k ? { background: WARNING, color: "#fff" } : { background: "#fff", color: "#9A4400" }}>{l}</button>
          ))}
        </div>
        <div className="flex rounded-[8px] overflow-hidden border text-[12px]" style={{ borderColor: WARNING }}>
          <span className="px-3 py-1" style={{ background: WARNING, color: "#fff" }}>app · 375</span>
        </div>
      </div>
    </div>
  );
}
function Sidebar({ activePage, setActivePage, demoState, setDemoState, following, toggleFollow, role, setRole }) {
  const groups = useMemo(() => {
    const g = {};
    PAGES.forEach(p => { (g[p.group] = g[p.group] || []).push(p); });
    return g;
  }, []);
  return (
    <div className="w-[220px] shrink-0 border-r border-[var(--chrome-border)] text-[13px]" style={{ background: "var(--chrome-panel)" }}>
      <div className="p-3">
        <div className="text-[11px] text-[var(--chrome-text-dim)] mb-1.5 font-semibold">角色</div>
        <div className="flex gap-1.5">
          {[["user", "用户端"], ["admin", "后台端"]].map(([k, l]) => (
            <button key={k} onClick={() => setRole(k)} className="px-2.5 py-1.5 rounded-[8px] text-[12px] border border-[var(--chrome-border)]" style={role === k ? { background: BRAND, color: "#fff", borderColor: BRAND } : { color: "var(--chrome-text)" }}>{l}</button>
          ))}
        </div>
      </div>
      {role === "admin" ? <div className="p-3 pt-0 text-[12px] text-[var(--chrome-text-dim)] leading-5">后台端：标的库、大师持仓、板块、市场异动、宏观指标</div> : <>
      <div className="p-3 pt-0">
        <div className="text-[11px] text-[var(--chrome-text-dim)] mb-1.5 font-semibold">流程 · 页面清单</div>
        {Object.entries(groups).map(([g, list]) => (
          <div key={g} className="mb-2">
            <div className="text-[11px] text-[var(--chrome-text-dim)] px-1 mb-1">{g}</div>
            {list.map(p => (
              <button key={p.id} onClick={() => setActivePage(p.id)}
                className={`w-full text-left px-2.5 py-1.5 rounded-[8px] mb-0.5 ${
                  activePage === p.id ? "text-white" : "text-[var(--chrome-text)] hover:bg-black/5"
                }`} style={activePage === p.id ? { background: BRAND } : {}}>
                {p.name}
              </button>
            ))}
          </div>
        ))}
      </div>
      <div className="p-3 pt-0">
        <div className="text-[11px] text-[var(--chrome-text-dim)] mb-1.5 font-semibold">演示控制</div>
        {DEMO_CONTROLS.map(c => {
          const disabled = !c.affects.includes(activePage);
          const isActive = c.id === "follow" ? following : demoState === c.id;
          return (
            <button key={c.id} disabled={disabled}
              title={disabled ? "对当前页面无影响" : ""}
              onClick={() => c.id === "follow" ? toggleFollow() : setDemoState(demoState === c.id ? "default" : c.id)}
              className={`w-full text-left px-2.5 py-1.5 rounded-[8px] mb-1 border text-[12px] ${
                disabled ? "opacity-30 cursor-not-allowed border-transparent" :
                isActive ? "border-transparent text-white" : "border-[var(--chrome-border)] text-[var(--chrome-text)]"
              }`}
              style={!disabled && isActive ? { background: BRAND } : {}}>
              {c.label}
            </button>
          );
        })}
      </div>
      </>}
    </div>
  );
}
function PageLabel({ p, role = "用户端" }) {
  return (
    <div className="text-[11px] text-[var(--chrome-text-dim)] mb-1.5 px-0.5">
      {p.name} · {p.scene} · {role} · app
    </div>
  );
}
function PageFrame({ p, children }) {
  return (
    <div className="inline-block align-top">
      <PageLabel p={p} />
      <div className="rounded-[28px] border border-[#D9D9D9] shadow-lg overflow-hidden" style={{ width: 375 }}>
        {children}
      </div>
    </div>
  );
}

/* ============ 11. App 根组件 ============ */
function App() {
  const [mode, setMode] = useState("journey");
  const [role, setRole] = useState("user");
  const [activePage, setActivePage] = useState("p2");
  const [demoState, setDemoState] = useState("default");
  const [following, setFollowing] = useState(false);
  const [chip3, setChip3] = useState("全部");
  const [chip4, setChip4] = useState("全部");
  const [chip6, setChip6] = useState("全部");
  const [chip10, setChip10] = useState("全部");
  const [watchSub, setWatchSub] = useState("现货");
  const [asset, setAsset] = useState({ ...TRADFI_CONTRACT[4] });
  const [stock, setStock] = useState({ ...STOCK_LIST[0] });
  const [diagStock, setDiagStock] = useState({ ...STOCK_LIST[0] });
  const toggleFollow = () => setFollowing(f => !f);
  const goTo = (id) => { if (!PAGES.some((p) => p.id === id)) return; setRole("user"); setMode("journey"); setActivePage(id); };
  window.__goTo = goTo;
  const openAsset = (item) => { setAsset(item); goTo("p5"); };
  const openStock = (item) => { setStock(item); goTo("p9"); };
  const openDiagnosis = (item) => { setDiagStock(item); goTo("p16"); };

  const common = { demoState, following, toggleFollow, openAsset, openStock, openDiagnosis, goTo };
  const propsFor = (id) => ({
    p0: { ...common, sub: watchSub, setSub: setWatchSub },
    p3: { ...common, chip: chip3, setChip: setChip3 },
    p4: { ...common, chip: chip4, setChip: setChip4 },
    p5: { ...common, asset, setAsset },
    p6: { ...common, chip: chip6, setChip: setChip6 },
    p9: { ...common, stock, setStock },
    p10: { ...common, chip: chip10, setChip: setChip10 },
    p16: { ...common, diagStock, setDiagStock },
  }[id] || common);

  return (
    <div style={{ background: "var(--chrome-bg)", color: "var(--chrome-text)", minHeight: "100vh" }}>
      <Banner mode={mode} setMode={setMode} />
      <div className="flex">
        {(mode === "journey" || role === "admin") && (
          <Sidebar activePage={activePage} setActivePage={setActivePage} demoState={demoState}
            setDemoState={setDemoState} following={following} toggleFollow={toggleFollow} role={role} setRole={setRole} />
        )}
        {role === "admin" ? <div className="flex-1 min-w-0"><AdminBackend /></div> :
        <div className="flex-1 p-6 overflow-x-auto">
          {mode === "journey" ? (
            (() => { const p = PAGES.find(x => x.id === activePage); const C = p.Comp;
              return <PageFrame p={p}><C {...propsFor(p.id)} /></PageFrame>; })()
          ) : (
            <div className="flex flex-wrap gap-6">
              {PAGES.map(p => { const C = p.Comp;
                return <PageFrame key={p.id} p={p}><C {...propsFor(p.id)} /></PageFrame>; })}
            </div>
          )}
        </div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
